<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Vendas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables CSS -->
  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-4">
    <h2> Relatório de Vendas de Áreas</h2>

    <!-- Filtros -->
    <div class="row g-3 my-3">
      <div class="col-md-3">
        <label class="form-label">Região</label>
        <select id="filtro_regiao" class="form-select">
          <option value="">Todas</option>
          <option>Norte</option>
          <option>Centro-Oeste</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Cidade</label>
        <select id="filtro_cidade" class="form-select">
          <option value="">Todas</option>
          <option>Maringá</option>
          <option>Londrina</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Ponto Focal</label>
        <select id="filtro_ponto" class="form-select">
          <option value="">Todos</option>
          <option>Feclopes</option>
          <option>Assistência Social</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Área de Curso</label>
        <select id="filtro_area" class="form-select">
          <option value="">Todas</option>
          <option>Tecnologia</option>
          <option>Gastronomia</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Publico ou privado</label>
        <select id="filtro_area" class="form-select">
          <option value="">Todas</option>
          <option>puiblico</option>
          <option>privado</option>
        </select>
      </div>
    </div>

    <!-- Tabela de Resultados -->
    <div class="table-responsive">
      <table id="tabela_vendas" class="display nowrap table table-bordered" style="width:100%">
        <thead>
          <tr>
            <th>Região</th>
            <th>Cidade</th>
            <th>Ponto Focal</th>
            <th>Área de Curso</th>
            <th>Data da Compra</th>
          </tr>
        </thead>
        <tbody>
          <!-- Exemplo de dados estáticos (substitua por dados do backend) -->
          <tr>
            <td>Norte</td>
            <td>Maringá</td>
            <td>Feclopess</td>
            <td>Tecnologia</td>
            <td>2025-07-07</td>
          </tr>
          <tr>
            <td>Centro-Oeste</td>
            <td>Londrina</td>
            <td>Assistencia social</td>
            <td>Gastronomia</td>
            <td>2025-07-05</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- JS - jQuery, Bootstrap, DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <!-- Script DataTables -->
  <script>
    $(document).ready(function() {
      var tabela = $('#tabela_vendas').DataTable({
        dom: 'Bfrtip',
        buttons: ['copy', 'csv', 'excel', 'pdf', 'print'],
        responsive: true,
        language: {
          url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
        }
      });

      // Filtros
      $('#filtro_regiao, #filtro_cidade, #filtro_ponto, #filtro_area').on('change', function () {
        var regiao = $('#filtro_regiao').val().toLowerCase();
        var cidade = $('#filtro_cidade').val().toLowerCase();
        var ponto = $('#filtro_ponto').val().toLowerCase();
        var area = $('#filtro_area').val().toLowerCase();

        tabela.rows().every(function() {
          var data = this.data();
          var show = true;

          if (regiao && !data[0].toLowerCase().includes(regiao)) show = false;
          if (cidade && !data[1].toLowerCase().includes(cidade)) show = false;
          if (ponto && !data[2].toLowerCase().includes(ponto)) show = false;
          if (area && !data[3].toLowerCase().includes(area)) show = false;

          if (show) {
            $(this.node()).show();
          } else {
            $(this.node()).hide();
          }
        });
      });
    });
  </script>
</body>
</html>
